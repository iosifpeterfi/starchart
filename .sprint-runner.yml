name: "StarChart Web3 Session Reliability Sprint"
description: "Fix stuck drain queue, session reattach, nonce races, timeouts, and clean logout"

branch: "main"
base_branch: "main"

plan: "E3_SESSION_RELIABILITY_PLAN.md"

review:
  areas:
    - "Session lifecycle: only drainQueue opens sessions, no pre-open races"
    - "Session reattach: attachSession from localStorage, fallback to new session"
    - "Drain resilience: watchdog resets stuck state, one-shot has timeout"
    - "Logout cleanup: queue cleared, session closed, all state reset"
    - "Regression: optimistic UI preserved, signatures verified, no XSS"
  max_rounds: 10
  exit_bar: "3 consecutive rounds with 0 HIGH findings"

invariants:
  - "No startSession calls outside ensureSession/drainQueue"
  - "ensureSession tries attachSession before startSession"
  - "drainQueue one-shot path has a timeout (120s)"
  - "drainQueue watchdog resets _queueRunning after 5 minutes of no progress"
  - "doLogout clears queue, resets _queueRunning/_activeWrite, removes session orderId"
  - "Queue capped at 50 items"
  - "enqueueAction still applies optimistic local state before queueing"
  - "Session orderId persisted in localStorage"
  - "Frontend bundle builds without errors (node build.mjs)"
